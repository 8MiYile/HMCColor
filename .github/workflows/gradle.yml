# This workflow builds and tests the HMCColor Minecraft plugin
# Optimized for Kotlin/Java projects with Paper API dependencies

name: Build and Test HMCColor Plugin

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  release:
    types: [ published ]

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v5

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-home-cache-cleanup: true
        cache-read-only: ${{ github.event_name == 'pull_request' }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build --no-daemon --stacktrace

    - name: Run tests
      run: ./gradlew test --no-daemon --continue
      if: success() || failure()

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      if: success()
      with:
        name: HMCColor-Plugin-${{ github.sha }}
        path: build/libs/*.jar
        retention-days: 30

    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: test-results-${{ github.sha }}
        path: |
          build/reports/tests/
          build/test-results/
        retention-days: 7

  dependency-submission:
    # Only run on push to main/master branch and if dependency graph is enabled
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # Note: This requires the dependency graph to be enabled in repository settings
    # See: https://docs.github.com/code-security/supply-chain-security/understanding-your-software-supply-chain/configuring-the-dependency-graph
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v5
      continue-on-error: true

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build release artifacts
      run: ./gradlew clean shadowJar --no-daemon

    - name: Upload release assets
      run: gh release upload "${{ github.event.release.tag_name }}" "build/libs/HMCColor-${{ github.event.release.tag_name }}.jar"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
